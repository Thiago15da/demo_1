name: MCA & Smart — Quality Assurance

on:
  push:
    paths:
      - "index.html"
      - "parques-industriales.html"
      - "proyectos.html"
      - "servicios-smart.html"
      - "contacto.html"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/mca-qa.yml"
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Start local preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mca-preview.log 2>&1 &
          sleep 2
      - name: Test MCA, Smart, masterplan, projects and lead forms
        run: node tests/mca-qa.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mca-smart-desktop-mobile
          path: test-results/
          if-no-files-found: ignore
