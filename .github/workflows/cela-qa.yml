name: CELA — QA visual

on:
  push:
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "assets/cela-mark.svg"
      - "tests/visual-qa.mjs"
      - ".github/workflows/cela-qa.yml"
  workflow_dispatch:
jobs:
  desktop-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser testing environment
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Start local preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/cela-preview.log 2>&1 &
          sleep 2
      - name: Verify UI and interactions on desktop and mobile
        run: node tests/visual-qa.mjs
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cela-escritorio-celular
          path: test-results/
          if-no-files-found: ignore
