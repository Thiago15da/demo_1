name: MCA - Media QA Snapshot
on:
  push:
    paths:
      - ".github/workflows/mca-media-review.yml"
  workflow_dispatch:
jobs:
  media-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export assets for art direction inspection
        uses: actions/upload-artifact@v4
        with:
          name: mca-local-media-review
          path: |
            assets/media/mca-official-logo.png
            assets/media/industrial-detail.jpg
            assets/media/park-parana.jpg
            assets/media/smart-people.jpg
          if-no-files-found: error
